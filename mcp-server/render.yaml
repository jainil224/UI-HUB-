# Render blueprint for UI HUB MCP Server
services:
  - name: ui-hub-mcp
    type: web
    runtime: node
    plan: starter
    region: oregon
    rootDir: mcp-server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_PORT
        value: 3001
      - key: MCP_SERVER_URL
        value: https://ui-hub-mcp.onrender.com
      - key: MCP_API_KEY_PREFIX
        value: uh_live_
      - key: MCP_RATE_LIMIT_FREE
        value: 150
      - key: MCP_RATE_LIMIT_PRO
        value: 10000
      - key: MCP_ALLOWED_ORIGINS
        value: https://www.uihub.codes,https://uihub.codes,https://ui-hub-design.vercel.app,http://localhost:5173,http://localhost:3000
      - key: MCP_ADMIN_EMAILS
        value: jainil11199@gmail.com,jainil224@gmail.com,jainilpatel2224@gmail.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: uihub
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Observability (additive). The alert scheduler runs in-process on this
      # single Render MCP instance only; serverless runtimes must leave it false.
      - key: MCP_ALERTS_SCHEDULER_ENABLED
        value: "true"
      - key: MCP_ALERTS_INTERVAL_MS
        value: "60000"
      - key: MCP_DIAGNOSTICS_RETENTION_DAYS
        value: "90"
      - key: MCP_LINKCHECK_ENABLED
        value: "false"
