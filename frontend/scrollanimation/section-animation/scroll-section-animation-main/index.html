<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Scroll Animation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main>
  <section class="panel one">
    <div class="container">
      <div class="col">
        <h1>Entry Point</h1>
      </div>
      <div class="col">
        <p>
          This space introduces an initial idea without defining its outcome.
        </p>
      </div>
    </div>
  </section>

  <section class="panel two">
    <div class="container">
      <div class="col center">
        <div class="img">
          <img src="img1.jpg" alt="">
        </div>
      </div>

      <div class="col text">
        <h1>Gesture</h1>
        <p>
          Form and expression intersect without explanation.
        </p>
      </div>
    </div>
  </section>

  <section class="panel three">
    <div class="container">
      <div class="col text">
        <h1>Variation</h1>
        <p>
          Repetition is avoided in favor of subtle change.
        </p>
      </div>

      <div class="col center">
        <div class="img">
          <img src="img2.jpg" alt="">
        </div>
      </div>
    </div>
  </section>

  <section class="panel four">
    <div class="container column">
      <div class="img large">
        <img src="img3.jpg" alt="">
      </div>

      <h1>The Stance</h1>

      <p>
        A clearer position begins to take shape.
      </p>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>

</body>
</html>
