name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend `lint` script is `tsc --noEmit`, so this is a real typecheck.
  # `dist/` is restored afterwards to keep the diff limited to source fixes.
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Restore committed dist
        if: always()
        run: git checkout -- frontend/dist 2>/dev/null || true

  # The backend suite is mock-based and fully offline: no database, network,
  # or credentials are required. `npm test` also gates on premium coverage.
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # backend has a postinstall that installs mcp-server, so make sure the
      # workspace it expects exists before npm ci runs.
      - name: Prepare mcp-server workspace
        working-directory: mcp-server
        run: npm ci --ignore-scripts
      - run: npm ci
      - name: Test
        run: npm test

  mcp-server:
    name: MCP server tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      # `build` runs `tsc`, so it doubles as the typecheck.
      - name: Build
        run: npm run build
      - name: Restore committed dist
        if: always()
        run: git checkout -- mcp-server/dist 2>/dev/null || true

  cli:
    name: CLI tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      # `build` runs `tsc -p tsconfig.json`, so it doubles as the typecheck.
      - name: Build
        run: npm run build
      - name: Restore committed dist
        if: always()
        run: git checkout -- cli/dist 2>/dev/null || true
